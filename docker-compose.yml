# Local: set POSTGRES_PASSWORD in .env, then: docker compose up --build
# Production: see docs/DEPLOY.md (uses docker-compose.prod.yml as well)
# Then open http://localhost:3000 (create the first admin with: docker compose exec web npm run admin -- grant you@example.com)
# Build arguments: a proxy is only needed on networks that require one (leave the variables empty otherwise).
x-build: &build
  context: .
  args:
    HTTP_PROXY: ${HTTP_PROXY:-}
    HTTPS_PROXY: ${HTTPS_PROXY:-}
    NO_PROXY: ${NO_PROXY:-}

services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: "${POSTGRES_USER:-blessly}", POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}", POSTGRES_DB: "${POSTGRES_DB:-blessly}" }
    volumes: [db:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blessly}"], interval: 5s, retries: 10 }
  migrate:
    build: *build
    command: npm run db:migrate
    env_file: .env
    environment: { DATABASE_URL: "postgres://${POSTGRES_USER:-blessly}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-blessly}" }
    depends_on: { db: { condition: service_healthy } }
  web:
    build: *build
    env_file: .env
    environment: { DATABASE_URL: "postgres://${POSTGRES_USER:-blessly}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-blessly}" }
    volumes: [uploads:/data/uploads]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
  worker:
    build: *build
    command: npm run jobs
    env_file: .env
    environment: { DATABASE_URL: "postgres://${POSTGRES_USER:-blessly}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-blessly}" }
    volumes: [uploads:/data/uploads]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
volumes: { db: {}, uploads: {} }
