# Render Blueprint: New → Blueprint → pick this repository. Fill in the secrets marked sync: false.
# Photos: set S3_* (e.g. Cloudflare R2) — Render's disk isn't shared between the web service and the worker.
databases:
  - name: wishwell-db
    plan: basic-256mb
    databaseName: wishwell
services:
  - type: web
    name: wishwell-web
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    preDeployCommand: npm run db:migrate
    envVars: &env
      - { key: DATABASE_URL, fromDatabase: { name: wishwell-db, property: connectionString } }
      - { key: APP_URL, sync: false }
      - { key: CRON_SECRET, generateValue: true }
      - { key: ENCRYPTION_KEY, sync: false }
      - { key: MEDIA_SIGNING_SECRET, generateValue: true }
      - { key: RATE_LIMIT_STORE, value: postgres }
      - { key: RESEND_API_KEY, sync: false }
      - { key: EMAIL_FROM, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: VAPID_PUBLIC_KEY, sync: false }
      - { key: VAPID_PRIVATE_KEY, sync: false }
      - { key: VAPID_SUBJECT, sync: false }
      - { key: RAZORPAY_KEY_ID, sync: false }
      - { key: RAZORPAY_KEY_SECRET, sync: false }
      - { key: RAZORPAY_WEBHOOK_SECRET, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: WHATSAPP_APP_SECRET, sync: false }
      - { key: WHATSAPP_VERIFY_TOKEN, sync: false }
      - { key: S3_BUCKET, sync: false }
      - { key: S3_ENDPOINT, sync: false }
      - { key: S3_REGION, sync: false }
      - { key: S3_ACCESS_KEY_ID, sync: false }
      - { key: S3_SECRET_ACCESS_KEY, sync: false }
      - { key: SUPPORT_EMAIL, sync: false }
      - { key: LEGAL_COMPANY_NAME, sync: false }
  - type: worker
    name: wishwell-jobs
    runtime: docker
    plan: starter
    dockerCommand: npm run jobs
    envVars: *env
